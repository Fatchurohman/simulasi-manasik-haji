<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Manasik Haji & Umrah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>Simulasi Manasik Haji & Umrah</h1>
            <p>Panduan Interaktif & Edukatif Langkah demi Langkah</p>
            <!-- Tambahan Identitas Developer -->
            <div class="dev-badge">
                <span class="blinking-dot"></span>
                <span>developer : fatur62</span>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- Panel Kontrol Simulasi -->
            <section class="card">
                <h2>Panel Kontrol Perjalanan</h2>
                <p>Pilih fase ibadah yang ingin disimulasikan:</p>
                <div class="button-group">
                    <button id="btnGateway" class="btn">1. Cek Berkas Kemenag</button>
                    <button id="btnTanahSuci" class="btn">2. Perjalanan & Madinah</button>
                    <button id="btnPuncakHaji" class="btn">3. Puncak Haji (Arafah-Mina)</button>
                </div>
            </section>

            <!-- Panel Output / Layar Game -->
            <section class="card output-card">
                <h2>Log Aktivitas & Panduan</h2>
                <div id="outputConsole" class="console-box">
                    Selamat datang, Jamaah. Silakan klik salah satu tombol di panel kontrol untuk memulai simulasi.
                </div>
            </section>
        </main>
    </div>

    <!-- Script Logika -->
    <script src="kemenag_gateway.js"></script>
    <script src="manasik_tanah_suci.js"></script>
    <script src="puncak_haji.js"></script>
    <script src="app.js"></script>
</body>
</html>
